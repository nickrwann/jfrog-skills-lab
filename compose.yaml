services:
  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-pro:7.161.15
    container_name: jfrog-skills-artifactory
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "8081:8081"
      - "8082:8082"
    volumes:
      - artifactory-data:/var/opt/jfrog/artifactory

volumes:
  artifactory-data:
    name: jfrog-skills-artifactory-data
